name: Deploy documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Publish only the newest documentation build for the main branch.
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build and deploy Storybook
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Check out the exact main-branch revision being documented.
      - name: Check out repository
        uses: actions/checkout@v6

      # Match the minimum Node version supported by Forma and cache npm downloads.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      # Let the Storybook prebuild script perform the one required Forma build.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build documentation
        run: npm run build-storybook

      # Prepare and upload the static site expected by GitHub Pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
